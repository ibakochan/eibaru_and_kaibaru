<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ログイン</title>
  <style>
    body {
      margin: 0;
      background: #f6f7f9;
      color: #111827;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
    }
    main {
      box-sizing: border-box;
      width: min(440px, calc(100% - 32px));
      margin: 40px auto;
      padding: 28px 26px 24px;
      background: #fff;
      text-align: center;
      border: 1px solid rgba(17, 24, 39, 0.08);
      border-radius: 20px;
      box-shadow: 0 1px 2px rgba(17, 24, 39, 0.04), 0 16px 40px rgba(17, 24, 39, 0.05);
    }
    h1 {
      margin: 0 0 12px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.3;
    }
    .lead {
      margin: 0 0 20px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.65;
    }
    .google {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 44px;
      padding: 0 16px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      background: #fff;
      color: #111827;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .google img { width: 18px; height: 18px; }
    h2 {
      margin: 22px 0 14px;
      font-size: 18px;
      font-weight: 700;
    }
    form { text-align: left; }
    label {
      display: block;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }
    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      min-height: 44px;
      margin-top: 6px;
      padding: 0 12px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
    }
    button.primary {
      min-height: 44px;
      padding: 0 16px;
      border: 0;
      border-radius: 12px;
      background: #111827;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }
    button.primary:disabled { opacity: 0.6; cursor: default; }
    .error {
      margin: 0 0 12px;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.6;
    }
    .forgot {
      margin-top: 12px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #4b5563;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      cursor: pointer;
    }
    .reset {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(17, 24, 39, 0.08);
    }
    .reset p { margin: 0 0 10px; font-size: 13px; line-height: 1.6; color: #4b5563; }
    .done { margin-top: 16px; color: #17663a; font-size: 14px; line-height: 1.7; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <h1>ログインしてください</h1>
    <p class="lead">
      会員を受け入れる前に、先にログインしてください。<br>
      ここでログインしたあと、メールのリンクをもう一度開くと移管が完了します。
    </p>

    <div id="login-panel">
      <a class="google" href="{{ google_login_url }}">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo">
        <span>Googleでログイン</span>
      </a>

      <h2>通常ログイン</h2>
      <form id="login-form">
        {% csrf_token %}
        <p id="login-error" class="error" hidden></p>
        <label>
          メールアドレス
          <input id="login-email" type="email" autocomplete="email" required>
        </label>
        <label>
          パスワード
          <input id="login-password" type="password" autocomplete="current-password" required>
        </label>
        <button class="primary" id="login-submit" type="submit">ログイン</button>
      </form>
      <button class="forgot" id="forgot-open" type="button">パスワードを忘れた方</button>

      <div id="reset-panel" class="reset" hidden>
        <p>登録したメールアドレスを入力してください。アカウントがある場合、新しいパスワードを決めるページを送ります。</p>
        <p id="reset-error" class="error" hidden></p>
        <p id="reset-done" hidden></p>
        <label>
          メールアドレス
          <input id="reset-email" type="email" autocomplete="email">
        </label>
        <button class="primary" id="reset-submit" type="button">再設定メールを送る</button>
      </div>
    </div>

    <p id="logged-in" class="done" hidden>
      ログインしました。メールのリンクをもう一度開いて、移管を完了してください。
    </p>
  </main>
  <script>
    function csrfToken() {
      const input = document.querySelector("#login-form input[name=csrfmiddlewaretoken]");
      return input ? input.value : "";
    }

    function showError(id, message) {
      const node = document.getElementById(id);
      node.hidden = !message;
      node.textContent = message || "";
    }

    document.getElementById("forgot-open").addEventListener("click", function () {
      document.getElementById("reset-panel").hidden = false;
      this.hidden = true;
    });

    document.getElementById("login-form").addEventListener("submit", async function (event) {
      event.preventDefault();
      const button = document.getElementById("login-submit");
      button.disabled = true;
      showError("login-error", "");
      try {
        const response = await fetch("/accounts/saas/login/", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken(),
          },
          body: JSON.stringify({
            email: document.getElementById("login-email").value,
            password: document.getElementById("login-password").value,
          }),
        });
        const data = await response.json().catch(function () { return null; });
        if (!response.ok) {
          showError("login-error", (data && data.detail) || "ログインに失敗しました");
          button.disabled = false;
          return;
        }
        document.getElementById("login-panel").hidden = true;
        document.getElementById("logged-in").hidden = false;
      } catch (err) {
        showError("login-error", "ログインに失敗しました");
        button.disabled = false;
      }
    });

    document.getElementById("reset-submit").addEventListener("click", async function () {
      const email = document.getElementById("reset-email").value.trim();
      const button = this;
      showError("reset-error", "");
      if (!email || email.indexOf("@") === -1) {
        showError("reset-error", "メールアドレスを入力してください。");
        return;
      }
      button.disabled = true;
      try {
        const response = await fetch("/accounts/saas/password-reset/", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": csrfToken(),
          },
          body: JSON.stringify({ email: email }),
        });
        const data = await response.json().catch(function () { return null; });
        if (!response.ok) {
          showError("reset-error", (data && data.detail) || "送信できませんでした。");
          button.disabled = false;
          return;
        }
        const done = document.getElementById("reset-done");
        done.hidden = false;
        done.textContent = (data && data.detail) || "ご入力のメールアドレスにアカウントがある場合、パスワード再設定のご案内を送信しました。";
        button.hidden = true;
      } catch (err) {
        showError("reset-error", "送信できませんでした。");
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
