# Customer domains bought through Kaibaru.
# A name is served only after its certificate files exist:
#   /etc/nginx/custom-certs/<domain>.crt
#   /etc/nginx/custom-certs/<domain>.key
# Issue one with: sudo kaibaru-issue-custom-cert example.com
# kaibaru.jp and eibaru.jp keep their own server blocks.

map $ssl_server_name $custom_ssl_cert {
    default /etc/nginx/custom-certs/_missing.crt;
    "~^[A-Za-z0-9.-]+$" /etc/nginx/custom-certs/$ssl_server_name.crt;
}

map $ssl_server_name $custom_ssl_key {
    default /etc/nginx/custom-certs/_missing.key;
    "~^[A-Za-z0-9.-]+$" /etc/nginx/custom-certs/$ssl_server_name.key;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/custom-acme;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate $custom_ssl_cert;
    ssl_certificate_key $custom_ssl_key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /static/ {
        alias /home/bitnami/dp/mysite/staticfiles/;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_pass http://unix:/tmp/kaibaru_daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /ws/ {
        proxy_pass http://unix:/tmp/kaibaru_daphne.sock;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_connect_timeout 86400;
        proxy_send_timeout 86400;
    }
}
